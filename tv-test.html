<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV Test</title>
<script src="https://trademind-charting-library.onrender.com/charting_library/charting_library.js"></script>
</head><body style="margin:0;background:#111;color:#fff;font-family:monospace">
<div id="status" style="padding:10px;font-size:12px;max-height:200px;overflow:auto"></div>
<div id="c" style="width:100%;height:500px;"></div>
<script>
function log(m){var d=document.getElementById('status');d.innerHTML+='<div>'+new Date().toISOString().substr(11,8)+' '+m+'</div>';}
log('TV defined: '+(typeof TradingView!=='undefined'));
log('TV.widget: '+(typeof TradingView!=='undefined'&&!!TradingView.widget));
if(typeof TradingView==='undefined'){log('FATAL: library not loaded');}
else{
try{
log('Creating widget...');
var w=new TradingView.widget({
debug:true,
container:'c',
library_path:'https://trademind-charting-library.onrender.com/charting_library/',
datafeed:{
onReady:function(cb){log('datafeed.onReady');fetch('https://playbook-signal-dashboard.onrender.com/udf/config').then(function(r){return r.json()}).then(function(cfg){log('config OK');cb(cfg)}).catch(function(e){log('config FAIL: '+e.message)})},
resolveSymbol:function(sym,ok,err){log('resolveSymbol '+sym);fetch('https://playbook-signal-dashboard.onrender.com/udf/symbols?symbol='+encodeURIComponent(sym)).then(function(r){return r.json()}).then(ok).catch(function(){err('unknown')})},
getBars:function(si,res,from,to,ok,err,countBack){log('getBars '+si.ticker+' '+res);var u='https://playbook-signal-dashboard.onrender.com/udf/history?symbol='+encodeURIComponent(si.ticker)+'&resolution='+res+'&from='+from+'&to='+to+'&countback='+(countBack||300);fetch(u).then(function(r){return r.json()}).then(function(d){if(d.s!=='ok'&&d.s!=='no_data')throw new Error(d.errmsg);var bars=[];if(d.s==='ok'){for(var i=0;i<d.t.length;i++){bars.push({time:d.t[i]*1000,open:+d.o[i],high:+d.h[i],low:+d.l[i],close:+d.c[i]})}}log('bars: '+bars.length);ok(bars,{noData:d.s==='no_data'})}).catch(err)},
subscribeBars:function(){log('subscribeBars')},
unsubscribeBars:function(){log('unsubscribeBars')}
},
symbol:'EURUSD',interval:'60',theme:'dark',autosize:true,locale:'en',timezone:'Etc/UTC',disabled_features:['iframe_loading_same_origin']
});
w.onChartReady(function(){log('CHART READY!');});
log('widget constructor returned');
setTimeout(function(){
var f=document.querySelector('#c iframe');
if(f){log('IFRAME SRC: '+f.src);log('IFRAME HTML: '+f.outerHTML.substr(0,300));}
else{log('NO IFRAME FOUND');}
},3000);
}catch(e){log('CONSTRUCTOR ERROR: '+e.message);}
}
</script></body></html>
