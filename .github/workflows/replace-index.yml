name: Replace index.html with updated version

on:
  workflow_dispatch:

jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with the updated file
        run: |
          git config user.name "ryhantrade"
          git config user.email "ryhantrade@users.noreply.github.com"
          mv trading-super-app-2.html index.html
          git add -A
          git commit -m "Update: News page redesigned to match EdgeFlo"
          git push origin HEAD:main
