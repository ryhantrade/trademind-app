name: Rename uploaded file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename trading-super-app-2.html to index.html
        run: |
          git config user.name "ryhantrade"
          git config user.email "ryhantrade@users.noreply.github.com"
          if [ -f trading-super-app-2.html ]; then
            git mv trading-super-app-2.html index.html
            git commit -m "Rename trading-super-app-2.html to index.html"
            git push
          else
            echo "File already renamed; nothing to do."
          fi
